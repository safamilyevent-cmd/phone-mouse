name: Build Windows x64 and release ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build Phone Mouse (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem -Path '.source-parts' -Filter '*.b64' | Sort-Object Name
          if (-not $parts) { throw 'Source archive parts are missing.' }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($encoded))
          Expand-Archive -Path 'source.zip' -DestinationPath '.' -Force
          if (-not (Test-Path 'PhoneMouse/PhoneMouse.sln')) { throw 'PhoneMouse solution was not extracted.' }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show SDK information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "PhoneMouse/PhoneMouse.sln" --runtime win-x64

      - name: Build Release
        run: dotnet build "PhoneMouse/PhoneMouse.sln" --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >-
          dotnet publish "PhoneMouse/PhoneMouse.Server/PhoneMouse.Server.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output "${{ github.workspace }}\publish"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Prepare distributable ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "build-$($env:GITHUB_SHA.Substring(0,7))" }
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'dist\PhoneMouse-win-x64'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'publish\*') -Destination $packageDir -Recurse -Force
          Copy-Item -Path 'PhoneMouse\README_RU.md' -Destination $packageDir -Force
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "PhoneMouse.Server.exe" (
            echo PhoneMouse.Server.exe not found. Extract the complete ZIP again.
            pause
            exit /b 1
          )
          PhoneMouse.Server.exe
          if errorlevel 1 pause
          '@ | Set-Content -Path (Join-Path $packageDir 'Run-PhoneMouse.bat') -Encoding ASCII
          $winZip = Join-Path $env:GITHUB_WORKSPACE "dist\PhoneMouse-win-x64-$version.zip"
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $winZip -CompressionLevel Optimal
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE "dist\PhoneMouse-source-$version.zip"
          Compress-Archive -Path @('PhoneMouse', '.github', 'README.md') -DestinationPath $sourceZip -CompressionLevel Optimal
          "WIN_ZIP=$winZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMouse-win-x64
          path: ${{ env.WIN_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMouse-source
          path: ${{ env.SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
